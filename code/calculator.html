<!DOCTYPE html>
<html>
    <head>
        <title>morden scientific calculator</title>
        <link rel="stylesheet" href="calculator.css">
    </head>

    <body>
        <div class="every">
            
            <div class="tex">
                <input type="text" id="se" readonly t>
            </div>

            <div class="part">

                <div class="app">
                    <div class="for"><button type="submit">(</button></div>
                    <div class="for"><button type="submit">2nd</button></div>
                    <div class="for"><button type="submit">1/x</button></div>
                    <div class="for"><button type="submit">X!</button></div>
                    
                </div>

                <div class="geud">
                    <div class="for"><button type="submit">)</button></div>
                    <div class="for"><button type="submit">x<sup>2</sup></button></div>
                    <div class="for"><button type="submit"><sup>2</sup>√x</button></div>
                    <div class="for"><button type="submit">sin</button></div>
                  
                </div>

                <div class="shem">
                    <div class="for"><button type="submit">mc</button></div>
                    <div class="for"><button type="submit">x<sup>3</sup></button></div>
                    <div class="for"><button type="submit"><sup>3</sup>√x</button></div>
                    <div class="for"><button type="submit">cos</button></div>
                    
                </div>
                <div class="dara">
                    <div class="for"><button type="submit">m+</button></div>
                    <div class="for"><button type="submit">x<sup>y</sup></button></div>
                    <div class="for"><button type="submit">y√x</button></div>
                    <div class="for"><button type="submit">tan</button></div>
                    
                </div>
                <div class="dara">
                    <div class="for"><button type="submit">m-</button></div>
                    <div class="for"><button type="submit">e<sup>x</sup></button></div>
                    <div class="for"><button type="submit">In</button></div>
                    <div class="for"><button type="submit">e</button></div>
                   
                </div>

                <div class="dag">
                    <div class="for"><button type="submit">mr</button></div>
                    <div class="for"><button type="submit">10<sup>x</sup></button></div>
                    <div class="for"><button type="submit">Log<sub>10</sub></button></div>
                    <div class="for"><button type="submit">EE</button></div>
                    
                </div>

                <div class="babs">
                    <div class="dam"><button type="submit">AC</button></div>
                    <div class="fo"><button type="submit">7</button></div>
                    <div class="fo"><button type="submit">4</button></div>
                    <div class="fo"><button type="submit">1</button></div>
                    
                </div>

                <div class="bab">
                    <div class="dam"><button type="submit">+/-</button></div>
                    <div class="fo"><button type="submit">8</button></div>
                    <div class="fo"><button type="submit">5</button></div>
                    <div class="fo"><button type="submit">2</button></div> 
                </div>

                <div class="cac">
                    <div class="dam"><button type="submit">%</button></div>
                    <div class="fo"><button type="submit">9</button></div>
                    <div class="fo"><button type="submit">6</button></div>
                    <div class="fo"><button type="submit">3</button></div>
                    
                </div>

                <div class="bah">
                    <div class="foik"><button type="submit">/</button></div>
                    <div class="foik"><button type="submit">*</button></div>
                    <div class="foik"><button type="submit">-</button></div>
                    <div class="foik"><button type="submit">+</button></div>
                    
                </div>

            </div>

             <div class="last">
                    <div class="for"><button type="submit">sinh</button></div>
                    <div class="for"><button type="submit">cosh</button></div>
                    <div class="for"><button type="submit">tanh</button></div>
                    <div class="for"><button type="submit">π</button></div>
                    <div class="for"><button type="submit">Rad</button></div>
                    <div class="for"><button type="submit">Rand</button></div>
                    <div class="fak"><button type="submit">0</button></div>
                    <div class="fo"><button type="submit">.</button></div>
                    <div class="clear"><button type="submit">=</button></div>
               </div> 

        </div>
      
    </body>
    <script src="claculator.js" defer></script>

</html>
